# 学習用ローカル環境。
#   make minio-up … MinIO(S3 互換)を起動(Q55 以降)
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knock
      MINIO_ROOT_PASSWORD: knockknock
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 起動時にバケットを作る one-shot コンテナ
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 knock knockknock &&
      mc mb --ignore-existing local/uploads
      "

volumes:
  minio-data:
