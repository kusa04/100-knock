version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - errorlint
    - gosec
  settings:
    gosec:
      excludes:
        - G104 # errcheck と重複

formatters:
  enable:
    - gofmt
    - goimports
